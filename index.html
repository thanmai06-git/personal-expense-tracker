<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Tracker</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-4">
        Personal Expense Tracker
    </h1>

    <!-- Expense Form -->

    <div class="card p-4 mb-4">

        <h3>Add Expense</h3>

        <form id="expenseForm">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        class="form-control"
                        placeholder="Enter description"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        class="form-control"
                        placeholder="Enter amount"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>
                        Category
                    </label>

                    <select
                        id="category"
                        class="form-control">

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label>
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        class="form-control"
                        required>

                </div>

            </div>

            <button
                type="submit"
                class="btn btn-primary">
                Add Expense
            </button>

        </form>

    </div>


    <!-- Summary -->

    <div class="card p-3 mb-4">

        <h4>
            Total Expense:
            ₹<span id="total">0</span>
        </h4>

    </div>


    <!-- Filter -->

    <div class="mb-3">

        <label>
            Filter by Category
        </label>

        <select
            id="filter"
            class="form-control">

            <option value="All">
                All
            </option>

            <option value="Food">
                Food
            </option>

            <option value="Transport">
                Transport
            </option>

            <option value="Shopping">
                Shopping
            </option>

            <option value="Education">
                Education
            </option>

            <option value="Other">
                Other
            </option>

        </select>

    </div>


    <!-- Expense Table -->

    <div class="table-responsive">

        <table class="table table-bordered table-striped">

            <thead class="table-dark">

                <tr>

                    <th>Description</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="expenseList">

            </tbody>

        </table>

    </div>

</div>


<!-- jQuery -->

<script
    src="https://code.jquery.com/jquery-3.7.1.min.js">
</script>

<script src="script.js"></script>

</body>

</html>
